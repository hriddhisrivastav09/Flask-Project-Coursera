<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">Emotion Detector</h1>
                <p>Enter a statement and the application will detect the emotions it expresses.</p>
                <textarea id="textToAnalyze" class="form-control mb-3" rows="4"
                          placeholder="Type your statement here..."></textarea>
                <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
                <hr>
                <div id="system_response" class="mt-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
